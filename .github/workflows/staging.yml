name: Deploy to Kinsta Staging

# Button-only, like production. This used to run on every push to `staging`.
#
# Staging takes a branch input and production does not. Choosing a branch is the
# point here -- this is where a feature branch gets looked at before it goes near
# the live site. Same reasoning as northernvirginiamag.com's staging workflow.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy to staging'
        required: true
        default: 'staging'
      dry_run:
        description: 'Preview only -- list what would change, write nothing'
        type: boolean
        default: false

concurrency:
  group: kinsta-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # The branch name ends up in a shell on the server, so check it's a real
      # branch name before it goes anywhere. Checking it out also fails the run
      # early if the branch hasn't been pushed.
      - name: Check out the chosen branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Validate branch name
        env:
          BRANCH: ${{ inputs.branch }}
        run: git check-ref-format --branch "$BRANCH"

      # Identical to main.yml except for the password, port and branch. On Kinsta the
      # staging environment is the same host and site path, reached on its own SSH
      # port. The branch is passed as an env var rather than templated into the
      # script, so it can't inject shell.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          BRANCH: ${{ inputs.branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          host: ${{ secrets.KINSTA_SERVER_IP }}
          username: ${{ secrets.KINSTA_USERNAME }}
          password: ${{ secrets.PASSWORD_STAGING }}
          port: ${{ secrets.PORT_STAGING }}
          envs: BRANCH,DRY_RUN
          script: |
            set -e
            cd /www/summerszims_390/public
            git fetch origin "$BRANCH"
            echo "Staging is at: $(git log -1 --format='%h %s' HEAD)"
            echo "Deploying $BRANCH: $(git log -1 --format='%h %s' FETCH_HEAD)"
            if [ "$DRY_RUN" = "true" ]; then
              echo "--- Dry run: files that would change"
              git diff --stat HEAD FETCH_HEAD
              echo "--- Dry run: server-side edits to tracked files that would be overwritten"
              git status --short --untracked-files=no
              exit 0
            fi
            git reset --hard FETCH_HEAD
